name: sail-monitoring-dev

services:
  web:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
    init: true
    ports:
      - "127.0.0.1:4200:4200"
    volumes:
      - ../FE:/app/FE
      - node_modules:/app/FE/node_modules
      - angular_cache:/app/FE/.angular
      - build_output:/app/FE/dist
      - npm_cache:/root/.npm
    healthcheck:
      # Ready means dependencies are installed; Angular is started manually.
      test: ["CMD", "test", "-f", "/tmp/sail-dev-ready"]
      interval: 5s
      timeout: 5s
      start_period: 180s
      retries: 60

volumes:
  node_modules:
  angular_cache:
  build_output:
  npm_cache:
