<div class="min-h-screen flex flex-col w-full h-[100dvh]">
  <div class="app-container pt-[clamp(0.5rem, 2vh, 2.5rem)] gap-[clamp(0.5rem, 1vw, 1rem)]">

    @if(isLoggedIn()) {
    <app-header [authRole]="authRole()" (logout)="onLogout()" />
    }

    @if (feedback()) {
      <p class="bg-slate-800 text-slate-200 px-4 py-2 rounded text-sm" role="status" aria-live="polite">{{ feedback() }}</p>
    }

    <!-- Contenuto Principale -->
    <main class="flex-1 flex flex-col h-full min-h-0 overflow-y-auto">
      <router-outlet></router-outlet>
    </main>

  </div>
</div>
